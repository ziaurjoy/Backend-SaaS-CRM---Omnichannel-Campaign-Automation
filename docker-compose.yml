version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnichannel-backend-web:latest
    container_name: omnichannel_backend_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnichannel-backend-celery:latest
    container_name: omnichannel_backend_celery
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A config worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: omnichannel_backend_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
