version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnichannel-backend-web:latest
    container_name: omnichannel_backend_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    depends_on:
      - redis

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnichannel-backend-celery:latest
    container_name: omnichannel_backend_celery
    restart: always
    env_file:
      - .env
    command: celery -A config worker --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: omnichannel_backend_redis
    restart: always
    ports:
      - "6379:6379"
